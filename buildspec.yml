version: 0.2

env:
  variables:
    ECR_REPOSITORY: "whisker"

phases:
  pre_build:
    commands:
      - export ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
      - export REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - export REPOSITORY_URI="${REGISTRY}/${ECR_REPOSITORY}"
      - export IMAGE_TAG="$(printf '%s' "${CODEBUILD_RESOLVED_SOURCE_VERSION}" | cut -c 1-12)"
      - aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | docker login --username AWS --password-stdin "${REGISTRY}"
      - echo "Building ${REPOSITORY_URI}:${IMAGE_TAG}"

  build:
    commands:
      - docker build --pull -t "${REPOSITORY_URI}:${IMAGE_TAG}" -t "${REPOSITORY_URI}:latest" .

  post_build:
    commands:
      - docker push "${REPOSITORY_URI}:${IMAGE_TAG}"
      - docker push "${REPOSITORY_URI}:latest"
      - 'printf "Published image: %s\n" "${REPOSITORY_URI}:${IMAGE_TAG}"'
